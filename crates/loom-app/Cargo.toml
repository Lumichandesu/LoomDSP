[package]
name = "loom-app"
description = "The LoomDSP desktop app: patch canvas, inspector, and live audio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["audio", "synthesizer", "modular", "live", "dsp"]
categories = ["multimedia::audio", "gui"]

[[bin]]
name = "loom-app"
path = "src/main.rs"

[dependencies]
loom-core.workspace = true
loom-modules.workspace = true
loom-patch.workspace = true
loom-host-desktop.workspace = true
loom-canvas.workspace = true
iced_wgpu.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
iced = { workspace = true, features = ["smol"] }
clap.workspace = true
rfd.workspace = true
ron.workspace = true
etcetera.workspace = true
jiff.workspace = true
# Runs widget operations on the live window, for the control channel.
iced_runtime.workspace = true

[dev-dependencies]
hound.workspace = true

[lints]
workspace = true
