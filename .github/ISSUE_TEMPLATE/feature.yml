name: Feature request
description: Suggest a new feature or a change.
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the musical or practical need first, then any idea for a solution.
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Related requirement IDs
      description: For example FR-MIDI-02. See docs/product/requirements.md.
  - type: input
    id: spec
    attributes:
      label: Specification
      description: Link to the spec in docs/design/ that covers this, if there is one. Features are built from an agreed spec (see docs/design/README.md).
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The checks that close this issue. Each one is a test or a named manual check. Link the spec's acceptance criteria instead of copying them.
  - type: textarea
    id: questions
    attributes:
      label: Open questions
      description: What the spec does not answer yet, or "None". An issue with open questions is labelled `needs spec agreed`.
  - type: textarea
    id: idea
    attributes:
      label: Possible solution
